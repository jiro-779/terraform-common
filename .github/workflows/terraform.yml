name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
env:
  TF_VAR_aws_region: "eu-north-1"
  TF_VAR_project_name: "terraform-common"
  TF_VAR_vpc_cidr: "10.0.0.0/16"
  TF_VAR_public_subnet_1_cidr: "10.0.1.0/24"
  TF_VAR_public_subnet_2_cidr: "10.0.2.0/24"
  TF_VAR_private_subnet_1_cidr: "10.0.11.0/24"
  TF_VAR_private_subnet_2_cidr: "10.0.12.0/24"
  TF_VAR_private_db_subnet_1_cidr: "10.0.5.0/24"
  TF_VAR_private_db_subnet_2_cidr: "10.0.6.0/24"
jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log("OIDC aud:", payload.aud);
            console.log("OIDC sub:", payload.sub);
            console.log("repository:", payload.repository);
            console.log("ref:", payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::377228489440:role/Terraform-OIDC-Role
          aws-region: eu-north-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve